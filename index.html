<script>
/* 아이폰 · 웹 연결 — 엔진이 부르는 window.Android 를 Safari 기능으로 이어 줌(안드로이드 앱에선 진짜 Android 가 있어서 이 줄은 안 씀)
   저장 키 앞에 앱 고유 이름을 붙임: 같은 GitHub 계정의 웹앱들은 저장 공간(origin)을 같이 쓰므로 기록이 섞이지 않게 */
(function () {
  if (window.Android) return;
  var LS = null; try { LS = window.localStorage; } catch (e) {}
  function key(k) { return ((window.TOPIC && TOPIC.pkg) || 'topicapp') + ':' + k; }
  var synth = window.speechSynthesis || null, voice = null;
  function pickVoice() {
    try {
      var vs = (synth && synth.getVoices()) || [], en = vs.filter(function (v) { return /^en[-_]US/i.test(v.lang); });
      if (!en.length) en = vs.filter(function (v) { return /^en/i.test(v.lang); });
      var pref = ['Samantha', 'Ava', 'Allison', 'Susan', 'Nicky', 'Aaron', 'Tom', 'Alex'];
      var best = null;
      en.forEach(function (v) { var sc = (/premium|enhanced/i.test(v.name) ? 10 : 0) + (pref.indexOf(v.name.split(' ')[0]) >= 0 ? 5 : 0) + (v.localService ? 1 : 0);
        if (!best || sc > best.sc) best = { v: v, sc: sc }; });
      voice = best ? best.v : null;
    } catch (e) {}
  }
  if (synth) { pickVoice(); try { synth.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
  function say(t, rate) {
    try { if (!synth) return; synth.cancel(); var u = new SpeechSynthesisUtterance(String(t || '')); u.lang = 'en-US'; if (voice) u.voice = voice; u.rate = rate; synth.speak(u); } catch (e) {}
  }
  // 아이폰은 첫 읽어 주기를 손가락 터치 안에서만 허락 → 첫 터치 때 빈 소리로 열어 둠(듣기 문제가 저절로 읽어 줄 수 있게)
  function unlock() { try { if (synth) { var u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } } catch (e) {} document.removeEventListener('touchend', unlock, true); document.removeEventListener('click', unlock, true); }
  document.addEventListener('touchend', unlock, true); document.addEventListener('click', unlock, true);
  var tEl = null, tTimer = 0;
  function toast(m) {
    try {
      if (!tEl) { tEl = document.createElement('div'); tEl.style.cssText = 'position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:86%;background:rgba(30,30,30,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99999;text-align:center;transition:opacity .25s;pointer-events:none'; document.body.appendChild(tEl); }
      tEl.textContent = String(m); tEl.style.opacity = '1'; clearTimeout(tTimer); tTimer = setTimeout(function () { tEl.style.opacity = '0'; }, 2200);
    } catch (e) {}
  }
  function copy(t) {
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(String(t)).catch(function () {}); return; } } catch (e) {}
    try { var a = document.createElement('textarea'); a.value = String(t); a.style.cssText = 'position:fixed;top:-1000px'; document.body.appendChild(a); a.select(); document.execCommand('copy'); document.body.removeChild(a); } catch (e) {}
  }
  window.Android = {
    save: function (k, v) { try { LS && LS.setItem(key(k), v); } catch (e) {} },
    load: function (k) { try { return LS ? LS.getItem(key(k)) : null; } catch (e) { return null; } },
    toast: toast,
    speak: function (t) { say(t, 0.95); },
    speakSlow: function (t) { say(t, 0.7); },
    copy: copy,
    share: function (t, title) {
      try { if (navigator.share) { navigator.share({ title: String(title || ''), text: String(t) }).catch(function () {}); return; } } catch (e) {}
      toast('복사했어요 — 메시지 앱에 붙여 넣어 보내 주세요');
    }
  };
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
})();
</script>

<script>
/* 주제 설정 — 프로듀서 · A&R 영어 (10-22)
   엔진(core.js · app.js)은 공장 공통 · 이 파일은 '이 주제만의 것'(이름 · 묶음 · 순서 · 학습 단계 · 비슷한 말 무리 · 화면 문구)
   칸 설명 = 주제별_영어앱\안내.md '주제 설정 칸' */
var TOPIC = {
  name: '삑삑이',                                      // 사용자 10-22 '최종 구울 때 앱 이름은 삑삑이'                                // ('&'는 화면 시험 도구가 이름을 못 찾아서 이름엔 안 씀 · A&R은 목표 줄에)
  pkg: 'kr.topicenglish.musicpro',                      // 앱 고유 이름(한 번 정하면 그대로)
  simpleSend: true,                                     // 남에게 주는 앱 = '📤 기록 보내기' 단추 하나
  theme: { acc: '#0F766E', acc2: '#E3F3F0', accDark: '#5EC9BC', acc2Dark: '#17302D' },
  files: ['data.js', 'gloss.js', 'sense.js', 'examples.js', 'grammar.js'],
  minExamples: 3,
  reviewCriterion: '한국인 프로듀서 · A&R(학교 영어 단어는 알지만 실제로 말해 본 적은 거의 없음)이 해외 작곡가 · 연주자 · 엔지니어 · 아티스트와의 녹음 세션 · 믹스 피드백 · 이메일 · 통화에서 이 말을 듣고 바로 알아듣고, 그대로 입에서 꺼내 쓸 수 있는가 — 실제 현장에서 지금 쓰는 말인가 · 너무 딱딱하거나 무례하지 않은가',

  goal: '프로듀서 · A&R 일 — 해외 음악인과 세션 · 피드백 · 메일을 영어로 막힘없이',
  goalDate: null, goalLabel: '',

  // 낱말 묶음 · 새 말 들여오는 순서 — '바로 쓰는 한마디'와 '장면 대화'는 입에 붙어야 해서 세 번씩
  wordCats: ['feedback', 'talk', 'theory', 'song', 'write', 'session', 'mix', 'deliver', 'biz'],
  order: ['feedback', 'phrase', 'session', 'qa', 'talk', 'write', 'theory', 'phrase', 'mix', 'qa', 'song', 'biz', 'phrase', 'talk', 'deliver', 'qa', 'grammar'],
  // 학습 단계: 묶음마다 줄 순서 = 중요한 순 → 앞 40% = 1단계 · 75%까지 = 2단계 · 나머지 = 3단계
  tierOf: function (it, i) {
    if (it.cat === 'grammar') return ['g1', 'g2', 'g6', 'g7'].indexOf(it.lesson.id) >= 0 ? 1 : 2;
    var n = Core.byCat(it.cat).length || 1;
    return i < n * 0.4 ? 1 : i < n * 0.75 ? 2 : 3;
  },
  // 같은 빈칸에 둘 다 들어맞을 수 있는 말 → 서로 오답 보기로 내지 않음
  groups: [
    ['vibe', 'direction', 'energy', 'groove'], ['work', 'hit', 'land', 'slap'], ['banger', 'earworm'], ['print', 'bounce'], ['align', 'tighten up'], ['busy', 'overproduced'], ['fire', 'slap'], ['dial back', 'bring down', 'strip back', 'mute'],
    ['chorus', 'hook'], ['double', 'layer', 'overdub'], ['demo', 'rough mix', 'scratch vocal'], ['stems', 'instrumental', 'acapella', 'alt mix'],
    ['follow up', 'touch base'], ['generic', 'safe'], ['placement', 'hold'], ['track', 'instrumental'],
    // 뜻이 거의 같은 한마디(듣기 문제에서 정답이 둘 되지 않게 · 핵심 말로 묶음)
    ['time', 'ready'], ['circle', 'sleep'], ['again', 'mean', 'understand'], ['session', 'wrap'], ['good', 'thanks']
  ],
  // 뜻은 다르지만 헷갈리기 쉬운 말 → 같은 날 새로 안 들여옴(3일 떼기) · 둘 다 익은 뒤 '구별 문제'
  sim: [
    ['rush', 'drag'], ['flat', 'sharp'], ['major', 'minor'], ['bring up', 'bring down'], ['dry', 'wet'], ['warm', 'bright'],
    ['verse', 'chorus', 'bridge', 'pre-chorus'], ['intro', 'outro'], ['take', 'keeper'], ['pitch', 'pitchy'],
    ['split', 'publishing', 'royalties'], ['double', 'harmony', 'backing vocals'], ['half step', 'half time', 'octave'],
    ['key', 'key change', 'transpose'], ['tune', 'in tune'], ['release', 'rollout', 'single'], ['sign off', 'revision'],
    ['muddy', 'harsh'], ['generic', 'dated', 'cheesy'], ['loop in', 'follow up'], ['fill', 'riff'],
    ['hold', 'on hold', 'placement'], ['comp', 'compression'], ['track', 'top line'], ['sample', 'clear'],
    ['advance', 'royalties', 'points'], ['distributor', 'DSP'], ['ISRC', 'metadata'], ['buried', 'thin'], ['syllable', 'rhyme', 'prosody'],
    ['vibe', 'vibey'], ['air', 'glue'], ['boomy', 'boxy', 'muddy'], ['in the pocket', 'laid back', 'groove'], ['fire', 'catchy'], ['solo', 'mute'], ['availability', 'ETA'], ['sign', 'sign off']

<script>
/* 결선 영어 — 엔진(화면 없음 · 시험 도구에서도 그대로 돌아감) · v2 (10-17)
   · 데이터 → 항목(item) · 단어마다 예문 여러 개(examples.js)
   · 날짜 사다리: 배우는 중 → 1일 → 3일 → 7일 → 14일 → 30일 → 60일 → 120일 · 틀리면 1일 칸으로(+ 그 자리에서 5문제 · 10문제 뒤 다시)
   · 하루에 한 칸만 오름 · 익힘 = 서로 다른 3일에 맞히고, 마지막이 첫날보다 7일 이상 뒤
   · 새 말은 하루 10개 · 복습이 밀리면 멈춤 · 비슷한 말은 3일 이상 떼어 들여옴
   · 근거 = 서브창\7896ced9\영어_결선준비\개선준비_1017.md 4-1절 · 조사_원문_1017.md */
var Core = (function () {
  var WORD_CATS = TOPIC.wordCats;
  // 새 말 들여오는 순서(돌아가며) — 발표 · 질의응답 문장은 결선 목표라 두 번씩 끼움
  var ORDER = TOPIC.order;
  // 하루 기준 문제 수(약 20~25분) — 채우면 '오늘 기준 끝'이라고 알려 주되, 더 하고 싶으면 '계속'으로 그날은 제한 없이(10-17 사용자: 기준 100 · 더 하고 싶은 걸 막지 말 것)
  var DAY_MAX = 100;
  var POSKO = { n: '명사', v: '동사', adj: '형용사', adv: '부사', phr: '표현', op: '연산자', field: '데이터 필드', conj: '접속사', sent: '문장' }; if (TOPIC.posko) Object.keys(TOPIC.posko).forEach(function (k) { POSKO[k] = TOPIC.posko[k]; });
  var LADDER = [0, 1, 3, 7, 14, 30, 60, 120];   // 단계 st → 다음에 나올 때까지 날 수
  var TOP = LADDER.length - 1;
  var NEW_PER_DAY = 10, BACKLOG_MAX = 100, SPACE_DAYS = 3;
  // 새 말을 쉬는 기준은 실력에 맞춰 움직임: 하루 기준(100문제) 안에 소화할 수 있는 복습 수 = 100 ÷ (1 + 2 × 틀리는 비율)
  // (틀린 말 하나는 그 문제 + 유령 2번을 먹음) · 최근 7일 이어서 하기 정답률로 셈(30문제 안 되면 80%로 봄)
  // 예: 정답률 65% → 59개 · 80% → 71개 · 90% → 83개 · 100% → 100개 — 잘 풀수록 새 말이 덜 멈춤
  function backlogDay(S) {
    // 그 말의 '그날 첫 문제'만 셈(유령 · 새 말 다시는 방금 답을 본 뒤라 거의 맞아서 정답률이 부풀려짐)
    var since = Math.round(now() / 60000) - 7 * 1440, ok = 0, n = 0, seen = {};
    (S.log || []).forEach(function (e) {
      if (e[0] < since || (e[6] !== 'go' && e[6] !== 'cat') || e[2] === 'intro') return;
      var k = e[1] + '@' + dayOf(e[0] * 60000); if (seen[k]) return; seen[k] = 1;
      n++; if (e[3]) ok++;
    });
    var acc = n >= 30 ? ok / n : 0.8;
    return Math.round(DAY_MAX / (1 + 2 * (1 - acc)));
  }
  var CLOCK = function () { return Date.now(); };

  function rnd(n) { return Math.floor(Math.random() * n); }
  function pick(a) { return a[rnd(a.length)]; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '_'); }
  function lines(t) { return t.split('\n').map(function (x) { return x.trim(); }).filter(function (x) { return x; }); }
  function now() { return CLOCK(); }
  // 하루 = 새벽 4시에 바뀜(밤늦게 푼 것도 그날로)
  function dayOf(ms) { var d = new Date(ms); return Math.floor((ms - d.getTimezoneOffset() * 60000 - 4 * 3600000) / 86400000); }
  function today() { return dayOf(now()); }

  /* ── 데이터 읽기 ── */
  var ITEMS = [], BY_ID = {}, BY_CAT = {}, PROPER = {}, TEXT2ID = {};
  function add(it) {
    ITEMS.push(it); BY_ID[it.id] = it; (BY_CAT[it.cat] = BY_CAT[it.cat] || []).push(it);
    if (it.en && /^[A-Z]/.test(it.en) && it.cat !== 'phrase' && it.cat !== 'qa' && it.cat !== 'grammar') PROPER[it.en.toLowerCase()] = 1;   // Sharpe ratio · PnL 같은 고유 표기
  }
  // 괄호 설명을 떼어낸 핵심 뜻 — 괄호 자리에 빈칸을 남기지 않음('같은 묶음(업종 등)의' → '같은 묶음의')
  function coreMean(m) { var c = String(m || '').replace(/\s*\([^)]*\)/g, '').replace(/\s+/g, ' ').trim(); return c || String(m || ''); }
  function keyOf(ex) { var k = /\{([^}]+)\}/.exec(ex || ''); return k ? k[1] : ''; }

  function load(DATA, GRAMMAR) {
    ITEMS = []; BY_ID = {}; BY_CAT = {}; PROPER = {}; TEXT2ID = {};
    WORD_CATS.forEach(function (cat) {
      if (!DATA[cat]) return;
      lines(DATA[cat]).forEach(function (ln) {
        var p = ln.split('|');
        // m = 문제 · 보기에 쓰는 '진짜 뜻'(한글 발음 표기 빼기: 모멘텀(오르던 것이…) → 오르던 것이…)
        var pm = /^(.+?)\((.+)\)$/.exec(p[2]), mean = p[2], tl = false;
        if (pm && typeof TL !== 'undefined' && TL.indexOf(pm[1]) >= 0) { mean = pm[2]; tl = true; }
        else if (pm && (/[A-Za-z]/.test(pm[2]) || pm[2] === '인플레이션')) mean = pm[1];
        var k = keyOf(p[3]) || p[0];
        add({ id: cat + ':' + slug(p[0]), cat: cat, en: p[0], pos: p[1], ko: p[2], m: mean, tl: tl, ex: p[3], exKo: p[4] || '', note: p[5] || '', key: k,
              exs: [[p[3], p[4] || '', k]] });
      });
    });
    if (DATA.phrase) lines(DATA.phrase).forEach(function (ln, i) {
      var p = ln.split('|'), k = keyOf(p[0]);
      add({ id: 'phrase:' + i + '_' + slug(k || 'x'), cat: 'phrase', en: p[0].replace(/[{}]/g, ''), pos: 'sent', ko: p[1], m: p[1], ex: p[0], exKo: p[1], note: p[2] || '', key: k, exs: [[p[0], p[1], k]] });
    });
    if (DATA.qa) lines(DATA.qa).forEach(function (ln, i) {
      var p = ln.split('||');
      add({ id: 'qa:' + i, cat: 'qa', q: p[0], a: p[1], ko: p[2] || '', en: p[1], pos: 'qa' });
    });
    (GRAMMAR || []).forEach(function (L) {
      L.drill.forEach(function (d, i) { add({ id: 'grammar:' + L.id + '_' + i, cat: 'grammar', lesson: L, tpl: d, en: L.title, pos: 'gram' }); });
    });
    // 예문 더하기
    var ALLX = [typeof EXTRA !== 'undefined' ? EXTRA : '', typeof EXTRA2 !== 'undefined' ? EXTRA2 : '', typeof EXTRA3 !== 'undefined' ? EXTRA3 : '', typeof EXTRA4 !== 'undefined' ? EXTRA4 : ''].join('\n');
    lines(ALLX).forEach(function (ln) {
      var p = ln.split('|'), it = BY_ID[p[0]];
      if (it && p[1]) it.exs.push([p[1], p[2] || '', keyOf(p[1]) || it.key]);
    });
    // 보기에 쓰는 뜻 = 괄호 설명을 뺀 핵심 뜻(괄호 · 길이로 정답이 드러나지 않게)
    // 핵심 뜻이 겹치면(분산 · 분산(서로 다르게 담기)) 괄호 속 말을 핵심 뜻으로(괄호가 정답 단서가 되지 않게) + 서로 오답 금지(it.mcore로 비교)
    var cnt = {};
    ITEMS.forEach(function (it) { if (WORD_CATS.indexOf(it.cat) >= 0) { it.mc = it.mcore = coreMean(it.m); cnt[it.mc] = (cnt[it.mc] || 0) + 1; } else if (it.cat === 'phrase') it.mc = it.m; });
    ITEMS.forEach(function (it) {
      if (WORD_CATS.indexOf(it.cat) < 0 || cnt[it.mcore] < 2) return;
      var inner = /\(([^)]+)\)/.exec(it.m);
      if (inner && !/[A-Za-z]/.test(inner[1])) it.mc = inner[1].trim();
    });
    [typeof HOOKS !== 'undefined' ? HOOKS : {}, typeof HOOKS2 !== 'undefined' ? HOOKS2 : {}].forEach(function (H) { Object.keys(H).forEach(function (id) { if (BY_ID[id]) BY_ID[id].hook = H[id]; }); });
    ITEMS.forEach(function (it) {
      if (it.cat === 'qa' || it.cat === 'grammar') return;
      [it.en, it.mc, it.m, it.ko, it.key].forEach(function (t) { if (t && !TEXT2ID[String(t).toLowerCase()]) TEXT2ID[String(t).toLowerCase()] = it.id; });
    });
    return ITEMS;
  }

  /* 뜻이 비슷해 서로 바꿔 넣어도 맞을 수 있는 무리 → 서로 오답 보기로 내지 않음(정답이 둘인 문제 막기) */
  var GROUPS = TOPIC.groups || [];
  /* 뜻은 다르지만 헷갈리기 쉬운 무리 → 같은 날 새로 들여오지 않음(3일 떼기) · 둘 다 익은 뒤 '구별 문제'로 (10-17 사용자 기록: surge↔smooth · Variance↔분포 등) */
  var SIM = TOPIC.sim || [];
  function mapOf(G) { var M = {}; G.forEach(function (g, i) { g.forEach(function (w) { (M[w] = M[w] || []).push(i); }); }); return M; }
  var GMAP = mapOf(GROUPS), SMAP = mapOf(SIM);
  function wkey(o) { return String((o.cat === 'phrase' ? o.key : o.en) || '').toLowerCase(); }
  function share(M, a, b) { var x = M[wkey(a)] || [], y = M[wkey(b)] || []; for (var i = 0; i < x.length; i++) if (y.indexOf(x[i]) >= 0) return true; return false; }
  function sameGroup(a, b) { return share(GMAP, a, b); }
  function similar(a, b) { return share(SMAP, a, b) || sameGroup(a, b); }

  /* ── 기록 ── */
  function rec(S, id) { return S.items[id] || (S.items[id] = { st: 0, due: today(), n: 0, ok: 0, w: 0, fix: 0, okd: [], intro: today(), la: null, ei: 0 }); }
  function introduced(S, id) { return !!S.items[id]; }
  function mastered(S, id) {
    var r = S.items[id]; if (!r || !r.okd || r.okd.length < 3) return false;
    return r.okd[r.okd.length - 1] - r.okd[0] >= 7;
  }
  function known(S, it) { var r = S.items[it.id]; return !!r && r.st >= 2; }
  function confusers(S, it) {   // 내가 실제로 헷갈린 말(많은 순)
    var c = (S.conf || {})[it.id] || {};
    return Object.keys(c).sort(function (a, b) { return c[b] - c[a]; }).map(function (id) { return BY_ID[id]; }).filter(Boolean);
  }

  /* ── 오답 보기 고르기 ──
     A단계(아직 모르는 말): 비슷한 말 · 헷갈린 말은 빼고, 이미 본 다른 무리 말 중 같은 품사 · 비슷한 길이
     B단계(익은 말): 내가 헷갈린 말 · 비슷한 무리 말을 먼저(진짜 구별) — 정답이 둘 되는 무리(GROUPS)는 언제나 뺌 */
  function val(o, field) { return field === 'mc' ? (o.mc || o.m || o.ko) : o[field]; }
  // 문장 속 핵심 말의 품사 짐작(문장 빈칸 오답을 같은 품사로 맞추려고)
  function posGuess(w) {
    var k = String(w || '').toLowerCase(), hit = ITEMS.filter(function (o) { return WORD_CATS.indexOf(o.cat) >= 0 && (o.en.toLowerCase() === k || o.key.toLowerCase() === k); })[0];
    if (hit) return hit.pos;
    if (/ly$/.test(k)) return 'adv';
    if (/(ed|ing)$/.test(k)) return 'v';
    if (/(ous|ive|able|ible|al|ic|ful|less|er|est)$/.test(k)) return 'adj';

  /* ── 풀이 기록 ──

  /* 기록 요약 → 사람이 읽는 글(보내기용) */

  function pickRandom(S, cats, n, onlyIntro) {   // 들어온 말에서만(처음 보는 말이 카드 없이 나오지 않게)

  }
  function pickExam(S, n) {   // 오늘 처음 본 말은 빼고, 일주일 이상 버틴 말(단계 3+) 위주 · 모자라면 단계 2까지

    if (pool.length < n) pool = ITEMS.filter(function (it) { var r = S.items[it.id]; return r && r.intro < t && r.st >= 2; });
    if (pool.length < n) pool = ITEMS.filter(function (it) { var r = S.items[it.id]; return r && r.intro < t && r.st >= 1; });

    h += done ? '<div class="card done"><b>✓ 오늘 몫 끝</b><div class="soft">' + doneMsg(ti) + '</div></div>' + moreBtns(ti) + studyMore(ti)
      : '<button class="btn big" data-go="go">▶ 이어서 하기<small>' + todoMsg(ti) + ' · 이것만 누르면 돼요</small></button>';
    h += skillCard();
    if (!TOPIC.easy) h += '<div class="card"><div class="row"><div class="stat grow"><b>' + S.xp + '</b><span class="soft">XP</span></div>' +
      '<div class="stat grow"><b>🔥 ' + streakNow() + '</b><span class="soft">연속 일</span></div></div>' +
      '<div style="margin-top:10px" class="soft">오늘 할 일: ' + (done ? '끝 ✓' : '복습 ' + ti.due + '개 · 새 말 ' + ti.newLeft + '개 남음') + ' · 오늘 ' + ti.doneQ + ' / ' + Core.DAY_MAX + '문제 · +' + dayXP() + ' XP</div>' + bar(done ? 100 : 100 * dayXP() / Math.max(GOAL, dayXP() + 1), 'gold') +
      '<div style="margin-top:8px" class="soft">' + nextTxt + '</div>' + bar(lv.next ? 100 * (mastN - lv.L[0]) / (lv.next[0] - lv.L[0]) : 100) + '</div>';
    app.innerHTML = h; window.scrollTo(0, 0);
  }

  /* ── ⚙ 설정: 설정 · 관리 · 찾아보기(공부 흐름 밖의 것) — 홈은 공부만(10-17 사용자) ── */
  var BACK_TO = null;   // 설정에서 들어간 화면(단어장 · 문법 · 기록 · 묶음 · 앞당기기 · 로드맵)은 뒤로 가면 설정으로
  function settingsPage() {
    R = null; glClose(); BACK_TO = 'settings';
    var h = '<div class="qtop"><button class="back" data-go="homex" style="padding:0">← 홈</button></div><h1>⚙ 설정</h1>' +
      '<h2>설정</h2>' +
      (TOPIC.fontSlider ? '<button class="btn" data-fs="open">🔠 글씨 크기<small>홈 맨 위 \'가 글씨\' · 문제 화면 맨 위 \'가\' 단추로도 바꿀 수 있어요</small></button>' : '') +
      '<button class="btn" data-go="sound">' + (S.sound !== false ? '🔊 듣기 단추 보임' : '🔇 듣기 단추 숨김') + '<small>' + (canSpeak() ? '누를 때만 소리 · 조용한 곳이면 숨기기' : '이 화면에선 소리 없음') + '</small></button>' +
      (canSpeak() && Android.voices ? '<button class="btn" data-go="voice">🗣 목소리 고르기<small>들어 보고 가장 자연스러운 것으로(안 바꿔도 돼요)</small></button>' : '') +
      '<button class="btn" data-go="newper">📅 새 말 하루 ' + (S.newPer || Core.NEW_PER_DAY) + '개<small>눌러서 5 · 10 · 15 바꾸기 (' + (TOPIC.newPerDefault || 10) + ' 권장)</small></button>' +
      '<h2>관리</h2>' +
      (TOPIC.simpleSend ? '<button class="btn" data-go="stats">📤 기록 보내기<small>단어 업데이트가 필요할 때 보내 주세요</small></button>' : '<button class="btn" data-go="stats">📈 내 기록 · Claude에게 보내기<small>틀린 것 · 헷갈린 짝 · 날짜별 정답률 · 눌러 본 말</small></button>') +
      '<button class="btn xtra" data-go="place">🧭 이미 아는 말 빼기<small>확실히 아는 말은 확인 문제 하나로 넘기기</small></button>' +
      '<div class="xtra"><h2>따로 풀기 <span class="soft" style="font-size:13px">— 안 써도 돼요(홈의 \'더 공부하기\'가 알아서 섞어 줘요)</span></h2>' +
      '<button class="btn" data-go="hist">🎯 전체 랜덤 확인<small>예전에 배운 말만 무작위 · 맞혀도 칸 · XP 그대로</small></button>' +
      '<button class="btn" data-go="today">🔁 오늘 공부한 것 확인<small>오늘 푼 말만 무작위 · 같은 규칙</small></button>' +
      '<button class="btn" data-go="wrong">🔂 지난 오답 다시<small>어제 이전에 틀린 말 · 서로 다른 이틀 맞히면 오답 노트에서 빠져요</small></button>' +
      '<button class="btn" data-go="exam">🎓 졸업 시험<small>며칠 전에 익힌 말 30문제 · 점수 기록</small></button>' +
      '<button class="btn" data-go="cats">📚 묶음 골라 풀기<small>' + Object.keys(CATS).length + '개 묶음</small></button>' +
      '<button class="btn" data-go="extra">➕ 복습 앞당기기<small>복습 날이 가까운 말 미리 · 칸은 안 오름</small></button>' +
      '<button class="btn" data-go="blitz">⚡ 60초 번개<small>최고 ' + (S.best || 0) + '개 · 가볍게</small></button>' +
      '<button class="btn" data-go="match">🎮 짝 맞추기<small>가볍게</small></button>' +
      '</div><h2>찾아보기</h2>' +
      '<button class="btn" data-go="words">📖 단어장<small>찾아보기 · 단계 표시</small></button>' +
      (GRAMMAR.length ? '<button class="btn" data-go="grammar">🔧 ' + esc(TOPIC.grammarTitle || '문법 한 입') + '<small>꼭 필요한 ' + GRAMMAR.length + '가지</small></button>' : '') +
      (ROADMAP.length ? '<button class="btn" data-go="road">🗺️ ' + esc(TOPIC.roadmapTitle || '로드맵') + '<small>단계별 할 일 체크</small></button>' : '') +
      '<div class="soft" style="margin-top:14px">문제는 매번 새로 만들어져요(보기 · 예문 · 유형이 바뀜). 맞힌 말은 1일 → 3일 → 1주 → 2주 → 한 달… 잊을 때쯤 다시, 틀린 말은 몇 문제 뒤와 다음 날 다시 나와요.</div>';
    app.innerHTML = h; window.scrollTo(0, 0);
  }

  /* ── 문제 풀기 ── */
  var R = null;
  function startRound(mode, opt) {
    opt = opt || {};
    if (!{ extra: 1, cat: 1, place: 1, retry: 1, today: 1, hist: 1, wrong: 1, exam: 1, blitz: 1 }[mode]) BACK_TO = null;   // 설정에서 시작하는 것(따로 풀기 · 묶음 · 이미 아는 말 · 문법 연습)은 끝나면 설정으로(홈에서 시작했으면 BACK_TO가 이미 비어 있어 홈으로)
    var list = null, cats = allCats();
    if (mode === 'go') list = null;
    else if (mode === 'cat') { cats = [opt.cat]; list = null; }
    else if (mode === 'wrong') { list = Core.pickWrong(S, ROUND_N); if (!list.length) { toast('오답 노트가 비어 있어요 👍'); return home(); } }
    else if (mode === 'mix') list = Core.pickRandom(S, cats, ROUND_N, true);
    else if (mode === 'exam') { list = Core.pickExam(S, 30); if (list.length < 10) { toast('시험은 하루 이상 지난 말이 10개 넘으면 볼 수 있어요'); return home(); } }
    else if (mode === 'blitz') list = Core.pickRandom(S, cats, 80, true);
    else if (mode === 'extra') list = Core.extraList(S, ROUND_N);
    else if (mode === 'today') list = Core.todayList(S, 20);
    else if (mode === 'hist') list = Core.histList(S, 20);
    else if (mode === 'more') list = Core.moreList(S, 20);
    else if (mode === 'retry') list = opt.list;
    else if (mode === 'place') list = Core.placeList(S, 20);
    if (list && !list.length) { toast(mode === 'place' ? '뺄 새 말이 없어요' : '아직 들어온 말이 없어요 — 이어서 하기부터 해요'); return home(); }
    R = { mode: mode, opt: opt, cats: mode === 'cat' ? cats : null, list: list || [], dyn: !list, i: 0, ok: 0, xp: 0, combo: 0, maxCombo: 0, wrongs: [], newMast: 0, lastId: null };
    if (mode === 'blitz') { R.blitzEnd = Date.now() + 60000; R.tick = setInterval(function () { var el = document.getElementById('tm'); var s = Math.max(0, Math.ceil((R.blitzEnd - Date.now()) / 1000)); if (el) el.textContent = s + '초'; if (s <= 0) { clearInterval(R.tick); finish(); } }, 250); }
    if (mode === 'place') return placeAsk();
    ask();
  }

  function head() {
    return '<div class="qtop"><button class="back" data-go="home" style="padding:0">✕ 그만</button><span>' + (R.mode === 'blitz' ? '<span class="timer" id="tm">60초</span> · ' + R.ok + '개 맞힘' : (R.i + 1) + ' / ' + (R.dyn ? ROUND_N : R.list.length)) + '</span>' +
      '<span class="combo">' + (R.combo >= 2 ? '🔥 ' + R.combo + ' 연속' : '') + '</span><span>+' + R.xp + ' XP</span>' + (TOPIC.fontSlider ? '<button class="fsq" data-fs="open" aria-label="글씨 크기">가</button>' : '') + '</div>' +
      (R.mode !== 'blitz' ? bar(100 * R.i / (R.dyn ? ROUND_N : R.list.length)) : '');
  }
  function catLabel(it) { return CATS[it.cat] ? CATS[it.cat].icon + ' ' + CATS[it.cat].name : ''; }

  function ask() {
    if (!R || R.stopped) return;
    var it, isNew = false;
    if (R.dyn) {
      if (R.i >= ROUND_N) return finish();
      var nx = Core.nextItem(S, R.cats, R.lastId);
      if (!nx) return R.i ? finish() : dayDone();
      it = nx.it; isNew = !!nx.isNew;
    } else {
      if (R.i >= R.list.length) return finish();
      it = R.list[R.i];
    }
    R.it = it; R.lastId = it.id;
    if (isNew) return introCard(it);
    var r = S.items[it.id], st = r ? r.st : 0;
    var objective = R.mode === 'blitz' || R.mode === 'exam' || R.mode === 'extra' || R.mode === 'today' || R.mode === 'hist' || R.mode === 'more';
    var q = Core.makeQuestion(it, st, null, S, objective);
    if (r) r.lt = q.type;   // 실제로 나간 유형을 기억(다음번엔 다른 유형으로)
    showQ(q, r ? '' : ' · 새로 나온 말');
  }

  /* 첫 만남 카드: 뜻 · 예문 · 덧붙임 → 바로 쉬운 고르기 */
  function introCard(it) {
    if (Core.lessonSeen(S, it)) {   // 같은 문법 단원은 카드를 한 번만 — 다음 문제부터는 바로 연습
      Core.introduce(S, it.id); save();
      return showQ(Core.makeQuestion(it, 0, 'gram', S, false), ' · 아는 문법 단원의 새 문제');
    }
    Core.introduce(S, it.id); save();
    R.q = { id: it.id, type: 'intro', item: it, intro: true, options: [] }; R.t0 = Date.now(); R.done = false;
    var ex = it.exs ? it.exs[0] : [it.ex, it.exKo];
    var h = head() + '<div class="qlabel"><span class="pill">새 말 · 처음 만나기</span> <span class="soft">' + esc(catLabel(it)) + '</span></div>';
    if (it.cat === 'grammar') h += '<div class="card explain"><b>' + esc(it.lesson.title) + '</b><div style="margin:6px 0">' + esc(it.lesson.explain) + '</div>' + it.lesson.ex.map(function (e) { return '<div class="soft">· ' + tw(e, e) + '</div>'; }).join('') + '</div>';
    else if (it.cat === 'qa') h += '<div class="card explain"><div class="ex">Q. ' + tw(esc(it.q), it.q, it.id) + '</div><div class="ex">A. ' + tw(esc(it.a), it.a, it.id) + speakBtn(it.a) + '</div><div class="exko">' + esc(it.ko) + '</div></div>';
    else h += '<div class="card explain"><div class="w' + (it.cat === 'code' ? ' prompt code' : '') + '" style="margin:0">' + esc(it.en) + speakBtn(it.en) + ' <span class="soft">' + esc(it.pos === 'sent' ? '' : it.pos) + '</span></div>' +
      '<div style="font-size:18px;margin:4px 0">' + esc(it.mc || it.m || it.ko) + '</div>' + (it.ko !== (it.mc || it.m) ? '<div class="soft">' + esc(it.ko) + '</div>' : '') +
      (it.cat !== 'phrase' ? '<div class="ex">' + tw(Core.boldKey(esc(ex[0])), ex[0], it.id) + speakBtn(String(ex[0]).replace(/[{}]/g, '')) + '</div><div class="exko">' + esc(ex[1]) + '</div>' : '') +
      (it.hook ? '<div style="margin-top:6px">🔍 ' + esc(it.hook) + '</div>' : '') +
      (noteText(it) ? '<div class="soft" style="margin-top:6px">💡 ' + esc(noteText(it)) + '</div>' : '') + '</div>';
    h += '<div class="soft">한 번 읽고, 영어를 작게라도 소리 내어 한 번 말해 본 뒤 넘어가요. 몇 문제 뒤에 다른 방식으로 다시 물어요.</div><button class="btn big" data-intro="1">알겠어요 →</button>';
    app.innerHTML = h; window.scrollTo(0, 0);
  }
  // 카드 직후엔 묻지 않음(방금 본 걸 고르는 건 기억이 아님) → 3문제 · 10문제 뒤에 다른 유형으로 꺼냄
  function introDone() {
    Core.logAnswer(S, R.q, 0, true, (Date.now() - R.t0) / 1000, R.mode);
    save(); R.i++; ask();
  }

  function showQ(q, tag) {
    R.q = q; R.t0 = Date.now(); R.done = false; R.conf = ''; R.pendingReveal = null; glClose();
    var it = q.item;
    var h = head() + '<div class="qlabel"><span class="pill">' + esc(q.label) + '</span> <span class="soft">' + esc(catLabel(it)) + (tag || '') + '</span></div>' +
      (q.listen ? listenBox(q) : '') + '<div class="prompt ' + (q.listen ? 'lsn ' : '') + (q.small ? 'small ' : '') + (q.code ? 'code' : '') + '">' + ((q.type === 'en2ko' || q.type === 'disc' || q.type === 'listen') ? esc(q.prompt) : tw(q.html ? q.prompt : esc(q.prompt), srcOf(q), q.item.id)) + '</div>' +   /* 영어 → 뜻 문제는 문제 글 자체가 답이라 누를 낱말 표시를 안 함 */
      '<div class="soft">' + esc(q.sub) + '</div><div id="opts">';
    if (q.say) {
      h += '<button class="opt" data-say="s"><span class="n">😀</span>확실히 떠올렸어요</button><button class="opt" data-say="u"><span class="n">🤔</span>애매하게 떠올렸어요</button>' +
        '<button class="opt" data-say="n"><span class="n">🙈</span>못 떠올렸어요</button></div><div id="after"></div>';
      app.innerHTML = h; window.scrollTo(0, 0); return;
    }
    q.options.forEach(function (o, k) {
      h += '<button class="opt ' + (q.smallOpts ? 'small ' : '') + (q.codeOpts ? 'code' : '') + '" data-k="' + k + '"><span class="n">' + (q.ox ? '' : (k + 1)) + '</span>' + esc(o) + '</button>';
    });
    h += idkBtn() + '</div><div id="after"></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
  }

  /* 말해 보기: 확신 단추 → (확인 문제 또는 정답 보고 스스로 확인) */
  function sayPick(c) {
    if (!R || R.done) return;
    var q = R.q; R.conf = c; R.say = q;
    if (c === 'n') return settle(false, { conf: 'n' });
    if (Core.needCheck(S, c, q.item)) {   // 정답을 보기 전에 확인 문제
      var chk = Core.makeCheck(q.item, S);
      R.q = chk; R.done = false;
      var h = head() + '<div class="qlabel"><span class="pill">' + esc(chk.label) + '</span> <span class="soft">' + (c === 's' ? '확실하다고 했으니 한 번 확인해요' : '애매했으니 확인해요') + '</span></div>' +
        '<div class="prompt ' + (chk.small ? 'small' : '') + '">' + tw(esc(chk.prompt), srcOf(chk), chk.item.id) + '</div><div class="soft">' + esc(chk.sub) + '</div><div id="opts">';
      chk.options.forEach(function (o, k) { h += '<button class="opt ' + (chk.codeOpts ? 'code' : '') + (chk.smallOpts ? ' small' : '') + '" data-k="' + k + '"><span class="n">' + (k + 1) + '</span>' + esc(o) + '</button>'; });
      app.innerHTML = h + idkBtn() + '</div><div id="after"></div>'; window.scrollTo(0, 0);
      return;
    }
    // 확인 없이: 정답을 보여 주고 스스로 맞았는지
    var it = q.item, el = document.getElementById('opts');
    el.innerHTML = '<div class="card explain"><div class="w' + (it.cat === 'code' ? ' prompt code' : '') + '" style="margin:0">' + esc(q.reveal) + speakBtn(q.reveal) + '</div>' +
      (it.cat !== 'phrase' && q.ex ? '<div class="ex">' + tw(Core.boldKey(esc(q.ex)), q.ex, it.id) + '</div>' : '') + '</div>' +
      '<div class="soft">' + (it.cat === 'qa' ? TOPIC.qa.checkText
        : '떠올린 영어가 이 말과 같았나요? 비슷한 다른 말이 떠올랐다면 \'달랐어요\'예요.') + '</div>' +
      '<button class="opt" data-self="1">✓ 맞았어요</button><button class="opt" data-self="0">✗ 달랐어요</button>';
    R.pendingReveal = q.id;   // 정답을 봤으니, 채점 없이 나가면 오늘은 칸이 안 오르게
    S.pr = q.id;              // 앱이 그대로 꺼져도 다음에 켤 때 같은 처리(채점하면 지움)
  }

  // 사지선다의 '🤷 모르겠어요'(data-k=-1): 찍지 않게 — 틀림과 같이 처리(내일 다시 · 몇 문제 뒤 한 번 더) · 기록엔 (모름) · 헷갈린 짝 표엔 안 넣음
  //   60초 번개는 빠르게 넘기는 놀이라 뺌
  function idkBtn() { return R && R.mode === 'blitz' ? '' : '<button class="opt idk" data-k="-1"><span class="n">🤷</span>모르겠어요</button>'; }
  function choose(k) {
    if (!R || R.done) return;
    var q = R.q, ok = k === q.answer;
    if (q.check) {   // 말해 보기의 확인 문제
      if (R.conf === 's') Core.calib(S, ok);
      return settle(ok, { conf: R.conf, chk: ok, picked: k, shown: q });
    }
    settle(ok, { picked: k, shown: q });
  }

  function settle(ok, x) {
    if (!R || R.done) return;
    R.done = true; R.graded = (R.graded || 0) + 1; R.pendingReveal = null; delete S.pr;
    var q = R.say && (R.q.check || R.q.say || x.conf) ? R.say : R.q, shown = x.shown || q, secs = (Date.now() - R.t0) / 1000;
    var before = Core.mastered(S, q.id);
    if (R.mode !== 'place') Core.grade(S, q.id, ok, R.mode, { type: q.type, conf: x.conf });
    if (x.conf) Core.logAnswer(S, q, null, ok, secs, R.mode, { conf: x.conf, chk: x.chk, picked: shown.check ? x.picked : undefined, optsQ: shown.check ? shown : null });
    else Core.logAnswer(S, shown, x.picked, ok, secs, R.mode);
    if (!ok && (R.mode === 'go' || R.mode === 'cat')) Core.ghost(S, q.id);
    if (R.mode === 'go' || R.mode === 'cat') Core.tick(S);
    if (!before && Core.mastered(S, q.id)) R.newMast++;
    // 확인 모드(오늘 공부한 것 · 전체 랜덤)는 맞혀도 '인정' 안 함 — 칸도 XP도 그대로(찍었을 수도 · 몇 번이든 다시 돌릴 수 있어서)
    if (ok) { R.ok++; R.combo++; R.maxCombo = Math.max(R.maxCombo, R.combo); if (R.mode !== 'today' && R.mode !== 'hist' && R.mode !== 'more') { var g = (x.conf ? 14 : 10) + 2 * Math.min(R.combo - 1, 5); R.xp += g; gainXP(g); } }
    else { R.combo = 0; R.wrongs.push(q.item); }
    var bs = document.querySelectorAll('.opt');
    for (var i = 0; i < bs.length; i++) { bs[i].disabled = true; if (shown.options && i === shown.answer && !shown.say) bs[i].classList.add('ok'); else if (i === x.picked) bs[i].classList.add('bad'); }
    save();
    R.say = null;
    if (R.mode === 'blitz') { R.i++; setTimeout(ask, ok ? 250 : 900); return; }
    if (x.conf) { var oe = document.getElementById('opts'); if (oe) oe.innerHTML = ''; }   // 말해 보기 단추는 치움
    var hyper = x.conf === 's' && !ok;
    var msg = ok ? '정답!' + (R.combo >= 3 ? ' 🔥' + R.combo : '') : hyper ? '확실했는데 달랐어요 — 이럴 때 가장 잘 고쳐져요. 정답을 한 번 더 입으로!<div class="hyper">' + esc(q.item.en) + '</div>' : (x.conf === 'n' || x.picked === -1) ? '괜찮아요 🙂 찍지 않은 게 잘한 거예요 — 몇 문제 뒤랑 내일 한 번 더 볼게요' : '아깝다 🙂 몇 문제 뒤랑 내일 한 번 더 볼게요';
    document.getElementById('after').innerHTML = '<div class="flash ' + (ok ? 'ok' : 'soft-miss') + (hyper ? ' big' : '') + '">' + msg + '</div>' +
      explainCard(q, shown) + (ok || x.picked === undefined ? '' : mixCard(shown, x.picked)) + '<button class="btn big" id="next">다음 →</button>';
    var nb = document.getElementById('next'); if (nb) nb.scrollIntoView({ block: 'end' });
  }

  function explainCard(q, shown) {
    var it = q.item;
    if (it.cat === 'grammar') return '<div class="card explain"><div class="soft">' + esc(it.lesson.title) + '</div><div class="ex">' + tw(q.filled, it.tpl ? it.tpl.s : null, it.id) + '</div>' + (q.ko ? '<div class="exko">' + esc(q.ko) + '</div>' : '') + '<div class="soft" style="margin-top:4px">💡 ' + esc(q.explain) + '</div>' +
      '<div style="margin-top:8px;font-size:14px">📘 ' + esc(it.lesson.explain) + '</div>' + it.lesson.ex.map(function (e) { return '<div class="soft">· ' + tw(e, e) + '</div>'; }).join('') + '</div>';
    if (it.cat === 'qa') return '<div class="card explain"><div class="ex">Q. ' + tw(esc(it.q), it.q, it.id) + '</div><div class="ex">A. ' + tw(esc(it.a), it.a, it.id) + speakBtn(it.a) + '</div><div class="exko">' + esc(it.ko) + '</div></div>';
    var ex = q.ex || it.ex, exKo = q.exKo || it.exKo;
    var w = it.cat === 'phrase' ? '<div class="w" style="margin:0;font-size:17px">' + esc(it.en) + speakBtn(it.en) + '</div><div>' + esc(it.ko) + '</div>'
      : '<div class="w' + (it.cat === 'code' ? ' prompt code' : '') + '" style="margin:0">' + esc(it.en) + speakBtn(it.en) + ' <span class="soft">' + esc(it.pos) + '</span></div><div>' + esc(it.ko) + '</div>';
    var contrast = q.partner || (shown && shown.partner) ? (function (p) { return '<div class="soft" style="margin-top:6px">⚖️ 구별: <b>' + esc(it.en) + '</b> = ' + esc(it.mc || it.m) + ' · <b>' + esc(p.en) + '</b> = ' + esc(p.mc || p.m) + '</div>'; })(q.partner || shown.partner) : '';
    return '<div class="card explain">' + w + (it.cat !== 'phrase' ? '<div class="ex">' + tw(Core.boldKey(esc(ex)), ex, it.id) + speakBtn(String(ex).replace(/[{}]/g, '')) + '</div><div class="exko">' + esc(exKo) + '</div>' : '') +
      contrast + (it.hook ? '<div class="soft" style="margin-top:6px">🔍 ' + esc(it.hook) + '</div>' : '') + (noteText(it) ? '<div class="soft" style="margin-top:6px">💡 ' + esc(noteText(it)) + '</div>' : '') + '</div>';
  }

  /* 틀렸을 때: 내가 고른 말은 무슨 뜻이었나(헷갈린 짝 바로 구분) */
  function mixCard(q, k) {
    if (!q.options || q.ox || q.item.cat === 'grammar' || q.item.cat === 'qa' || k < 0) return '';   // k = -1 = 모르겠어요
    var o = Core.findByText(q.options[k]);
    if (!o || o.id === q.item.id) return q.type === 'spell' ? '<div class="card" style="border-left:4px solid var(--bad)"><div class="soft">내가 고른 것</div><div><b>' + esc(q.options[k]) + '</b> — 철자가 달라요. 정답: <b>' + esc(q.item.en) + '</b></div></div>' : '';
    return '<div class="card" style="border-left:4px solid var(--miss)"><div class="soft">내가 고른 것</div><div><b' + (o.cat === 'code' ? ' style="font-family:monospace"' : '') + '>' + esc(o.en) + '</b> = ' + esc(o.ko) + '</div>' +
      (o.ex && o.cat !== 'phrase' ? '<div style="font-size:13px;margin-top:4px">' + tw(Core.boldKey(esc(o.ex)), o.ex, o.id) + '</div>' : '') + '</div>';
  }

  function gainXP(g) {
    var d = today();
    if (S.lastDay !== d) { var yk = 'd' + (Core.today() - 1); S.streak = S.lastDay === yk ? (S.streak || 0) + 1 : 1; S.lastDay = d; }
    S.xp += g; S.days[d] = (S.days[d] || 0) + g;
  }

  function nextQ() { if (!R) return home(); R.i++; ask(); }

  function dayDone() {
    var k = Core.skill(S);

    app.innerHTML = '<h1>✓ 오늘 몫 끝</h1>' + moreBtns(tiD) + '<div class="card"><div>' + doneMsg(tiD) + '</div>' +
      (k.todayMast ? '<div style="margin-top:6px">🎯 오늘 \'진짜 익힘\'이 된 말 <b>' + k.todayMast + '</b>개' + (TOPIC.easy ? '' : ' (서로 다른 3일에 다시 떠올렸고, 첫날과 마지막 날이 7일 이상 떨어진 말)') + '</div>' : '') +
      '<div class="soft" style="margin-top:6px">여기서 쉬어도 돼요 — 내일 다시 꺼낼 때 가장 오래 남아요(잠이 사이에 끼면 기억이 굳어요).</div></div>' +
      studyMore(tiD) + skillCard() + '<button class="btn" data-go="home">홈으로</button>';

  function finish() {
    glClose();   // 번개가 시간 초과로 끝날 때 뜻 창이 결과 화면 위에 남지 않게
    if (!R) return home();
    if (R.tick) clearInterval(R.tick);
    R.stopped = true;   // 번개가 끝나는 순간 예약된 다음 문제가 결과 화면 위로 뜨지 않게
    var n = R.mode === 'blitz' ? R.i : R.dyn ? (R.graded || 0) : R.list.length, pct = n ? Math.round(100 * R.ok / n) : 100;   // 새 말 카드는 문제 수에 안 셈

    if (R.mode === 'exam' && !R.saved) { R.saved = 1; (S.exams = S.exams || []).push({ t: Date.now(), n: n, ok: R.ok, mast: Core.skill(S).mast }); }
    save(true);
    var msg = pct >= 90 ? '완벽해요! 🏆' : pct >= 70 ? '좋아요! 계속 가요 💪' : pct >= 50 ? '절반 넘었어요. 틀린 건 몇 문제 뒤와 내일 다시 나와요' : '처음엔 다 이래요. 틀린 게 바로 다음 공부예요';
    var h = '<h1>' + msg + '</h1><div class="card"><div class="row"><div class="stat grow"><b>' + R.ok + ' / ' + n + '</b><span class="soft">맞힘</span></div>' +
      '<div class="stat grow"><b>+' + R.xp + '</b><span class="soft">XP</span></div><div class="stat grow"><b>' + R.maxCombo + '</b><span class="soft">최고 연속</span></div>' +
      '<div class="stat grow"><b>' + R.newMast + '</b><span class="soft">새로 익힘</span></div></div></div>';

    h += more ? '<button class="btn big" data-go="go">▶ 이어서 하기<small>' + todoMsg(ti) + ' · 홈에 갈 필요 없이 이것만</small></button>'
              : '<div class="card done"><b>✓ 오늘 몫 끝</b><div class="soft">' + doneMsg(ti) + '</div></div>' + moreBtns(ti) + studyMore(ti);
    if (R.wrongs.length) {
      h += '<h2>틀린 것</h2>';
      R.wrongs.forEach(function (it) { h += '<div class="wl"><span class="e">' + esc(it.cat === 'grammar' ? it.lesson.title : it.cat === 'qa' ? it.q : it.en) + '</span> <span class="soft">' + esc(it.cat === 'qa' ? it.a : it.ko || '') + '</span></div>'; });
      h += '<div class="soft">틀린 말은 이어서 하기 안에서 몇 문제 뒤에 다시 나와요(바로 다시 푸는 것보다 오래 남아요).</div>';
    }
    h += (R.mode === 'go' ? '<button class="btn" data-go="match">🎮 짝 맞추기 보너스 (선택 · 1분)</button>' : '') + '<button class="btn" data-go="home">홈으로</button>';
    app.innerHTML = h; window.scrollTo(0, 0);
  }

  /* ── 🎮 짝 맞추기 보너스(재미 · 가볍게): 영어 ↔ 뜻 5쌍 · 알아보기 연습이라 익힘 단계는 그대로 ── */
  var M = null;
  function matchStart() {
    var set = Core.matchSet(S, 5);
    if (set.length < 3) { toast('들어온 말이 조금 더 쌓이면 할 수 있어요'); return home(); }
    R = null;
    M = { set: set, L: Core.shuffle(set), Rr: Core.shuffle(set), done: {}, pick: null, miss: 0, t0: Date.now() };
    matchDraw();
  }
  function matchDraw(flash) {
    var h = '<div class="qtop"><button class="back" data-go="home" style="padding:0">✕ 그만</button><span>짝 맞추기 · ' + Object.keys(M.done).length + ' / ' + M.set.length + '</span><span>틀림 ' + M.miss + '</span></div>' +
      '<div class="soft">왼쪽 영어를 누르고, 맞는 뜻을 오른쪽에서 눌러요.</div>' + (flash ? '<div class="flash bad">' + flash + '</div>' : '') + '<div class="mgrid"><div>';
    M.L.forEach(function (it, i) { h += '<button class="opt mt' + (M.done[it.id] ? ' ok' : M.pick === i ? ' sel' : '') + '" data-ml="' + i + '"' + (M.done[it.id] ? ' disabled' : '') + '>' + esc(it.en) + '</button>'; });
    h += '</div><div>';
    M.Rr.forEach(function (it, j) { h += '<button class="opt mt small' + (M.done[it.id] ? ' ok' : '') + '" data-mr="' + j + '"' + (M.done[it.id] ? ' disabled' : '') + '>' + esc(it.mc || it.m) + '</button>'; });
    app.innerHTML = h + '</div></div>'; window.scrollTo(0, 0);
  }
  function matchTap(side, i) {
    if (!M) return;
    if (side === 'l') { if (!M.done[M.L[i].id]) { M.pick = i; matchDraw(); } return; }
    if (M.pick === null) return matchDraw('먼저 왼쪽 영어를 눌러요');
    var a = M.L[M.pick], b = M.Rr[i];
    if (a.id === b.id) { M.done[a.id] = 1; M.pick = null; gainXP(3); }
    else { M.miss++; M.pick = null; Core.logEvent(S, 'miss', a.id, b.id); return matchDraw(esc(a.en) + ' ≠ ' + esc(b.mc || b.m)); }
    if (Object.keys(M.done).length >= M.set.length) {
      var sec = Math.round((Date.now() - M.t0) / 1000), best = !S.matchBest || sec < S.matchBest;
      if (best && M.miss === 0) S.matchBest = sec;
      Core.logEvent(S, 'match', sec, M.miss);
      save(true);
      app.innerHTML = '<h1>' + (M.miss ? '다 맞췄어요!' : '한 번도 안 틀렸어요! 🏆') + '</h1><div class="card"><div class="row"><div class="stat grow"><b>' + sec + '초</b><span class="soft">걸린 시간</span></div><div class="stat grow"><b>' + M.miss + '</b><span class="soft">틀림</span></div></div>' +
        '<div class="soft" style="margin-top:6px">짝 맞추기는 재미용 보너스예요. 진짜 실력은 이어서 하기의 말해 보기에서 쌓여요.</div></div>' +
        '<button class="btn big" data-go="match">한 판 더</button>' + (Core.todayInfo(S).due || Core.todayInfo(S).newLeft ? '<button class="btn big" data-go="go">▶ 이어서 하기</button>' : '') + '<button class="btn" data-go="home">홈으로</button>';
      M = null; return;
    }
    matchDraw();
  }

  /* ── 이미 아는 말 빼기(배치) ── */
  function placeAsk() {
    if (!R || R.stopped) return;
    if (R.i >= R.list.length) return placeEnd();
    var it = R.list[R.i]; R.it = it; R.pstage = 'ask';
    app.innerHTML = '<div class="qtop"><button class="back" data-go="home" style="padding:0">✕ 그만</button><span>' + (R.i + 1) + ' / ' + R.list.length + '</span><span>아는 말 ' + R.ok + '</span></div>' +
      '<div class="qlabel"><span class="pill">이미 아는 말 빼기</span> <span class="soft">' + esc(catLabel(it)) + '</span></div>' +
      '<div class="prompt' + (it.cat === 'code' ? ' code' : '') + '">' + esc(it.en) + '</div><div class="soft">뜻을 확실히 아는 말이면 \'알아요\' → 바로 확인 문제. 맞히면 그 말은 일주일 뒤에 확인만 해요.</div>' +
      '<div id="opts"><button class="opt" data-place="1">알아요</button><button class="opt" data-place="0">몰라요 · 애매해요</button></div><div id="after"></div>';
    window.scrollTo(0, 0);
  }
  function placePick(v) {
    if (!R || R.pstage !== 'ask') return;
    if (v === '0') { R.i++; return placeAsk(); }
    R.pstage = 'check';
    var q = Core.makeQuestion(R.it, 0, 'en2ko', S, true);
    q.label = '확인 · 정말 아나요?'; showQ(q, '');

  function placeChoose(k) {
    if (!R || R.done) return;
    R.done = true;
    var q = R.q, ok = k === q.answer;
    Core.logAnswer(S, q, k, ok, (Date.now() - R.t0) / 1000, 'place');
    if (ok) { Core.placeKnown(S, q.id); R.ok++; } else Core.placeFail(S, q.id);
    save();
    document.getElementById('after').innerHTML = '<div class="flash ' + (ok ? 'ok">아는 말이네요 — 일주일 뒤에 확인만 해요' : 'bad">새 말로 남겨 둘게요 — 이어서 하기에서 차근차근') + '</div>' + explainCard(q, q) + '<button class="btn big" id="next">다음 →</button>';
  }
  function placeEnd() {
    app.innerHTML = '<h1>아는 말 ' + R.ok + '개를 뺐어요</h1><div class="card soft">뺀 말은 새 말 몫(하루 10개)을 쓰지 않고, 일주일 뒤 · 2주 뒤에 확인만 해요. 틀리면 다시 배우는 칸으로 와요.</div>' +
      '<button class="btn big" data-go="place">20개 더</button><button class="btn" data-go="home">홈으로</button>';
  }

  function stats() {
    var rep = Core.report(S), newN = (S.log || []).length - Math.max(0, (S.sentAbs || 0) - (S.logBase || 0));

  }
  // 더 하고 싶은 날(사용자 10-22: 새 말 단추가 작아 안 보여 배운 말만 빙빙 돎) — 처음부터 끝까지 같은 구조(사용자 10-22):
  //   큰 단추 하나 '배운 말 다시 풀기'(10-17: 큰 단추는 하나) · 그 아래 선택지로 보통 단추 '새 말 5개 더 배우기'(몇 번이든)
  function easyMoreNew(ti, h) {
    return h + '<button class="btn" data-go="morenew">🆕 새 말 5개 더 배우기<small>' + (ti.backlog ? '복습이 밀린 날이라 쉬던 중이지만, 원하면 받아도 돼요' : '새 말을 배우고 몇 문제 뒤에 다시 풀어 바로 익혀요 · 몇 번이든 더 눌러도 돼요(내일부터 복습이 조금 늘어요)') + '</small></button>';
  }
  (function () {
    var de = document.documentElement;
    if (TOPIC.easy && de && de.classList) de.classList.add('easy');
    if (!document.createElement || !document.body || !document.head) return;   // 검사용 가짜 화면에선 건너뜀
    var css = 'html.easy .xtra{display:none!important}\n#app .prompt.lsn{display:none}\n#app .lbox .btn{margin:4px 0}\n#app .lbox .grid2{margin-top:6px}';
    app.addEventListener('click', function (ev) {   // 듣기 문제의 '👀 글자로 보기'
      var t = ev.target.closest && ev.target.closest('[data-lsnshow]'); if (!t) return;
      var pr = app.querySelector('.prompt.lsn'); if (pr) pr.classList.remove('lsn'); t.disabled = true;
    });
    if (TOPIC.fontSlider) css += [
      '#app .fsq{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 11px;font-size:15px;font-weight:800;font-family:inherit}',
      '#app .opt,#app .btn,#app .ex,#app .exko,#app .prompt,#app .card,#app h1,#app .soft,#gl .glc{overflow-wrap:anywhere}',
      '#app .qtop{flex-wrap:wrap;gap:2px 10px}',
      '#fsp{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center}',
      '#fsp .fsc{width:100%;max-width:620px;background:var(--card);color:var(--ink);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 22px rgba(0,0,0,.2);font-size:16px}',
      '#fsp .fsh{display:flex;justify-content:space-between;align-items:center;font-size:20px}',
      '#fsp .fsh span{color:var(--acc);font-weight:800}',
      '#fsp .fss{margin:12px 0;padding:12px;border:1px dashed var(--line);border-radius:12px;line-height:1.45;overflow-wrap:anywhere}',
      '#fsp .fsr{display:flex;align-items:center;gap:14px;margin:10px 0 16px}',
      '#fsp .fsr input{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:8px;border-radius:6px;background:var(--line);outline:none;margin:0}',
      '#fsp .fsr input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:32px;height:32px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}',
      '#fsp .fsr button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:50px;height:50px;font-size:15px;font-weight:700;font-family:inherit;padding:0}',
      '#fsp .fsr button.fsbig{font-size:26px}',
      '#fsp .fsrow{display:flex;gap:10px}',
      '#fsp .fsrow button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 8px;font-size:16px;font-family:inherit}',
      '#fsp .fsrow button.fsok{background:var(--acc);color:#fff;border:none;font-weight:700}'
    ].join('\n');
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    if (!TOPIC.fontSlider) return;
    var FSK = KEY + '_fs', MIN = 90, MAX = 150, STEP = 5, DEF = Math.round((TOPIC.fontScaleDefault || 1) * 100);
    function cur() { var v = parseInt(rawLoad(FSK), 10); return v >= MIN && v <= MAX ? v : DEF; }
    // 글씨는 #app(화면) · #gl(뜻 창)만 키움 — 이 창과 단추는 그대로라 막대를 끄는 동안 손가락 밑이 흔들리지 않음
    function apply(v) { var z = String(v / 100); app.style.zoom = z; var g = document.getElementById('gl'); if (g) g.style.zoom = z; }
    var p = document.createElement('div'); p.id = 'fsp'; p.hidden = true;
    p.innerHTML = '<div class="fsc"><div class="fsh"><b>글씨 크기</b><span id="fsv"></span></div>' +
      '<div class="fss" id="fss">Hello! Nice to meet you.<br>안녕하세요, 만나서 반가워요.</div>' +
      '<div class="fsr"><button type="button" data-fs="-" aria-label="작게">가</button><input type="range" id="fsr" min="' + MIN + '" max="' + MAX + '" step="' + STEP + '" aria-label="글씨 크기"><button type="button" data-fs="+" class="fsbig" aria-label="크게">가</button></div>' +
      '<div class="fsrow"><button type="button" data-fs="0">처음 크기로</button><button type="button" data-fs="x" class="fsok">다 됐어요</button></div></div>';
    document.body.appendChild(p);
    var r = p.querySelector('#fsr'), lab = p.querySelector('#fsv'), smp = p.querySelector('#fss');
    function show(v) { r.value = String(v); lab.textContent = v + '%'; smp.style.fontSize = (16 * v / 100) + 'px'; }
    var NOW = cur();   // 지금 화면에 적용된 크기(창을 열면 이 값 · 저장은 손을 뗄 때 · 창을 닫을 때)
    function set(v, keep) { v = Math.max(MIN, Math.min(MAX, Math.round(v / STEP) * STEP)); NOW = v; apply(v); show(v); if (keep) rawSave(FSK, String(v)); }
    function open() { show(NOW); p.hidden = false; }
    function close() { set(+r.value, true); p.hidden = true; }
    window.__fontSet = function (v) { set(v, false); };   // 검사용
    apply(NOW);
    r.addEventListener('input', function () { set(+r.value, false); });
    r.addEventListener('change', function () { set(+r.value, true); });
    p.addEventListener('click', function (ev) {
      ev.stopPropagation();
      if (ev.target === p) return close();   // 창 바깥(어두운 곳)을 누르면 닫힘
      var t = ev.target.closest ? ev.target.closest('[data-fs]') : null, k = t && t.getAttribute('data-fs');
      if (k === '-') set(+r.value - STEP, true); else if (k === '+') set(+r.value + STEP, true); else if (k === '0') set(DEF, true); else if (k === 'x') close();
    });
    app.addEventListener('click', function (ev) { var t = ev.target.closest && ev.target.closest('[data-fs="open"]'); if (t) open(); });   // 홈 '가 글씨' · 문제 화면 '가' · 설정 '글씨 크기' 단추
  })();
  home();
})();

</script>
</body>
</html>
